<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 30px auto; padding: 0 16px; background: #111318; color: #e5e7eb; }
  h1 { color: #f97316; font-size: 18px; }
  label { display: block; font-size: 13px; color: #9ca3af; margin: 14px 0 5px; }
  input { width: 100%; padding: 9px; border-radius: 8px; border: 1px solid #374151; background: #1a1d24; color: #e5e7eb; font-size: 13px; box-sizing: border-box; }
  button { margin-top: 18px; padding: 10px 22px; border: 0; border-radius: 8px; background: #f97316; color: #fff; font-size: 13px; cursor: pointer; }
  #msg { margin-top: 12px; font-size: 13px; min-height: 18px; }
  .ok { color: #4ade80; } .err { color: #f87171; }
  .hint { font-size: 12px; color: #6b7280; margin-top: 6px; line-height: 1.5; }
</style>
</head>
<body>
  <h1>⚙️ Options — Crowdfunding Tracker Sync</h1>

  <label>Serveur du tracker (URL complète)</label>
  <input id="server" placeholder="http://localhost:8016">
  <div class="hint">The LAN address of the machine running the Crowdfunding Tracker.</div>

  <label>Token de synchronisation</label>
  <input id="token" placeholder="Colle ici le token affiché dans Paramètres de l'app">
  <div class="hint">Dans le tracker : menu ⚙️ Paramètres → « Token de synchronisation » → copier. Le token ne remplace pas ton mot de passe : il sert uniquement à l'extension pour déposer les captures.</div>

  <button id="save">💾 Enregistrer</button>
  <div id="msg"></div>

  <script src="options.js"></script>
</body>
</html>
