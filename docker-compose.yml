services:
  crowdfunding-tracker:
    build: .
    image: crowdfunding-tracker:latest
    container_name: crowdfunding-tracker
    restart: unless-stopped
    environment:
      - PORT=${PORT:-8016}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-change-me}
      - COOKIE_SECURE=${COOKIE_SECURE:-1}
    volumes:
      - ./data:/app/data
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.crowdfunding.rule=Host(`${DOMAIN:-your-domain.example.com}`)"
      - "traefik.http.routers.crowdfunding.entrypoints=websecure"
      - "traefik.http.routers.crowdfunding.tls.certresolver=letsencrypt"
      - "traefik.http.services.crowdfunding.loadbalancer.server.port=${PORT:-8016}"
      - "traefik.http.routers.crowdfunding-web.rule=Host(`${DOMAIN:-your-domain.example.com}`)"
      - "traefik.http.routers.crowdfunding-web.entrypoints=web"
      - "traefik.http.routers.crowdfunding-web.service=crowdfunding"

networks:
  traefik-public:
    external: true
